# donnees/sources.toml — registre des données téléchargées (régime « mesure » : prises telles quelles).
#
# Règles :
# - Seul scripts/telecharger.py écrit dans donnees/telechargees/ (ou $B13_DONNEES), et seulement depuis ce registre.
# - sha256 vide = pas encore figé. Au premier téléchargement, /donnees calcule l'empreinte et propose
#   de l'écrire ici ; la modification de ce fichier demande l'accord de Micky (règle ask).
# - Une empreinte figée ne change que par une décision datée dans docs/decisions/ (nouvelle version de la donnée).
# - type = "paquet" : fourni par une dépendance Python ; version et empreinte relevées dans le manifeste à l'exécution.
# - Vérifié par scripts/verifications/integrite.py (skill verify, hook pre-commit, CI).

[[source]]
id = "de440s"
fichier = "de440s.bsp"
url = "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp"
miroir = "https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp"
sha256 = ""
taille_approx = "32 Mo"
couverture = "1849–2150"
licence = "Diffusion par le JPL (NASA) ; conditions à confirmer ⚠️"
usage = "Positions astrométriques des 10 objets, passages du Soleil"

