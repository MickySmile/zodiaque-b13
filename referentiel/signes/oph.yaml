  items:
  - 'Surintervention : tout devient une occasion de conseiller.'
  - 'Sauvetage : l''autre est apprécié surtout comme personne à aider.'
  - 'Monopole : garder une connaissance difficile d''accès pour rester nécessaire.'
  - 'Invulnérabilité affichée : ne jamais montrer de besoin.'
  - 'Scrupule paralysant : éviter toute décision par peur de ses effets.'
  - 'Déresponsabilisation : invoquer l''incertitude pour ne répondre de rien.'
  - 'Supériorité morale : faire de sa prudence une preuve de valeur.'
  - 'Goût de la complexité : rendre mystérieux ce qui pourrait être expliqué.'
  source: docs/prd/02-serpentaire.md § 6
  provenance:
  - C
  caveat: des impasses narratives à explorer, jamais des diagnostics
- label: Dans les relations
  status: transcribed
  text: 'Dans les relations, le thème n''est pas « aimer les personnes blessées » mais la négociation
    de l''asymétrie : que se passe-t-il quand l''un sait ce que l''autre ignore ? Peut-on refuser une
    aide sans abîmer le lien ? La relation tient-elle quand les rôles s''inversent ? Peut-on être aimé
    sans être nécessaire ? Une relation satisfaisante permettrait de dire : « Tu peux m''aider, mais tu
    n''as pas à me prendre en charge ; je peux te faire confiance sans te croire infaillible. »'
  source: docs/prd/02-serpentaire.md § 6
  provenance:
  - C
